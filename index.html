<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>byMetro - Twin Cities Transit Guide</title>
  <meta name="description" content="Official Developer Website for byMetro - Real-time Metro Timings & Routes in Islamabad & Rawalpindi." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050E0E;
      --card-bg: #0B1C1D;
      --primary-teal: #00A896;
      --accent-cyan: #02C39A;
      --text-main: #FFFFFF;
      --text-muted: #8E9E9D;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(0, 168, 150, 0.25);
      border-radius: 24px;
      padding: 48px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 168, 150, 0.1);
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(0, 168, 150, 0.15);
      border: 1px solid var(--primary-teal);
      color: var(--accent-cyan);
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #FFFFFF 0%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 18px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }
    @media (max-width: 500px) {
      .links-grid {
        grid-template-columns: 1fr;
      }
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--primary-teal);
      color: #FFFFFF;
      box-shadow: 0 4px 15px rgba(0, 168, 150, 0.4);
    }
    .btn-primary:hover {
      background: var(--accent-cyan);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }
    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Official Developer Portal</div>
    <h1>byMetro</h1>
    <p class="subtitle">Real-Time Twin Cities Transit Guide & Timings for Islamabad and Rawalpindi Metro Bus & Green/Blue Lines.</p>
    
    <div class="links-grid">
      <a href="./app-ads.txt" class="btn btn-secondary">
        📄 View app-ads.txt
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.metrotimings.metro_timings" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
        📲 Google Play Store
      </a>
    </div>

    <div class="footer">
      <p>&copy; 2026 byMetro. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
